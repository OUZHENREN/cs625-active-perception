# 两张桌子的**近似** xy 边界（只用于生成仿真世界与 MoveIt 场景）
#
# 为什么需要这份文件
# ------------------
# `runtime/environment/<ts>/model.json` 里的桌子 xy 范围不是"量出来的桌边"，而是
# "锚点 ±search_radius(0.45 m) 窗口内洪泛填充"的外接矩形。真机桌面比这个窗口大，
# 于是四边被窗口裁平（两张桌子都正好 0.92 = 0.90 + 0.02），结果是：
#
#     工件桌 x[0.260,1.180] y[0.280,1.080] z=-0.0910
#     插槽桌 x[0.780,1.700] y[-0.280,0.640] z=-0.0407
#     ⇒ x 重叠 400 mm、y 重叠 360 mm、高度差 50 mm
#
# 所有者确认真机两桌**并不重叠，中间还有一小段缝**。重叠会让 Gazebo 把工件顶起来：
# 实测工件实际位姿相对设计位姿偏了 Δx=-26 / Δy=+11 / Δz=+9 mm、pitch +7.2°。
#
# 数据来源与精度
# --------------
# 下面的边界是**近似值**，依据只有两条硬约束：
#   1. 每张桌子必须完整盖住自己上面那个物体（工件 / 插槽夹具）；
#   2. 两张桌子不许重叠，中间留一小段缝。
# 真实的桌边尺寸尚未测量。所有者要求：仿真阶段不为它花时间，先把"不重叠 + 高度差正确"
# 这两条落实；完整的多机位点云建模（在有限空间内拍多机位、真正量出桌边）留到真机阶段补做。
#
# 不允许在这里覆盖的
# ------------------
# **顶面高度 z**。高度差是实测物理量，必须由 model.json 提供，本文件只覆盖 xy。
# 覆盖后若仍然重叠，`scripts/build_sim_world.py` 会直接报错而不是生成一个物理上
# 不可能的世界。
#
# 物体占位（用于核对本文件是否自洽）
# ----------------------------------
#   工件（工作件）世界 bbox:  x[0.474, 0.951]  y[0.450, 0.745]
#   插槽夹具   世界 bbox:     x[1.059, 1.268]  y[-0.387, 0.361]

cell_tables:
  workpiece_table:
    xy_min: [0.300, 0.300]
    xy_max: [0.990, 0.900]
  slot_table:
    xy_min: [1.010, -0.450]
    xy_max: [1.700, 0.400]
