# Pick-and-place flow parameters for the real CS625 cell (2026-10-22 verified run).
# Poses are world-frame TCP positions in metres.

pre_grasp: [0.7677, 0.4903, -0.0595]
grasp: [0.8316, 0.5918, -0.0583]
grasp_q: [-0.4835, 0.8753, 0.0075, 0.0018]

transit: [0.95, 0.45, 0.55]
staging: [1.0748, -0.0122, 0.5252]
pre_insert: [1.0996, -0.0125, 0.3773]
insert: [1.1574, -0.0132, 0.0321]

pre_insert_q: [-0.004, 0.997, -0.001, 0.083]
insert_q: [-0.003, 1.000, -0.002, -0.004]

baseline: [1.044, -0.011, 0.726]
baseline_q: [-0.059, 0.938, 0.060, 0.336]

grip_width_mm: 50.0
grip_current: 0.1
lift_total_mm: 155.0
safe_clear_mm: 150.0

velocity_scale: 0.02
assembly_velocity_scale: 0.01
time_scale: 2.0
dwell_sec: 1.0
goal_tolerance: 0.002
max_chunks: 7

# Per-phase speed plan (uneven speed): cruise fast, slow down for the final segment
# near the workpiece or inside the slot.
phase_speeds:
  pre_grasp:   {velocity: 0.08, time_scale: 1.0, chunks: 3}
  grasp:       {velocity: 0.04, time_scale: 1.5, chunks: 3, slow_tail_mm: 30, slow_velocity: 0.010, slow_time_scale: 3.0}
  lift:        {velocity: 0.03, time_scale: 1.5, chunks: 3}
  transit:     {velocity: 0.08, time_scale: 1.0, chunks: 3}
  staging:     {velocity: 0.05, time_scale: 1.5, chunks: 3}
  pre_insert:  {velocity: 0.03, time_scale: 1.5, chunks: 4, slow_tail_mm: 60, slow_velocity: 0.010, slow_time_scale: 2.5}
  # tight clearance (about 1 mm per side): uniform slow speed, uneven speed only after validation
  insert:      {velocity: 0.005, time_scale: 3.0, chunks: 6}
  # tight clearance: uniform slow speed
  straighten:  {velocity: 0.005, time_scale: 3.0, chunks: 2}
  withdraw:    {velocity: 0.03, time_scale: 1.5, chunks: 3}
  baseline:    {velocity: 0.08, time_scale: 1.0, chunks: 3}
