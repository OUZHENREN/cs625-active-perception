scope: unload
mode: efficient
flow: unload
phases:
- observe:slot_coarse
- observe:slot_fine
- observe:tables
- d1_staging
- d2_init_before_slot
- d2a_pre_insert
- d2b_entrance_tilted
- d2c_straighten
- d3a_gripper_init
- d3b_grip
- d3c_pull_test
- d3d_pull_check
- d3e_return
- d4_tilt_for_removal
- d5_extract_*
- d6a_lift
- d6b_transit
- d7a_place_pre_grasp
- d7b_place_grasp
- d8_release
- d8b_init_before_retreat
- d9a_withdraw
- d9b_lift
- d9c_baseline
- observe:workpiece_coarse
velocity_scale: 0.05
assembly_velocity_scale: 0.02
time_scale: 1.0
dwell_sec: 0.0
max_chunks: 1
phase_speeds:
  d1_staging:
    velocity: 0.12
    time_scale: 1.0
    chunks: 1
  d2a_pre_insert:
    velocity: 0.02
    time_scale: 1.0
    chunks: 1
  d2b_entrance_tilted:
    velocity: 0.03
    time_scale: 1.0
    chunks: 1
    slow_band_mm:
    - 0
    - 80
  d2c_straighten:
    velocity: 0.005
    time_scale: 1.0
    chunks: 1
  d3c_pull_test:
    velocity: 0.005
    time_scale: 1.0
    chunks: 1
  d3e_return:
    velocity: 0.01
    time_scale: 1.0
    chunks: 1
  d4_tilt_for_removal:
    velocity: 0.005
    time_scale: 1.0
    chunks: 1
  d5_extract:
    velocity: 0.005
    time_scale: 1.0
    chunks: 1
  d6a_lift:
    velocity: 0.03
    time_scale: 1.0
    chunks: 1
  d6b_transit:
    velocity: 0.12
    time_scale: 1.0
    chunks: 1
  d7a_place_pre_grasp:
    velocity: 0.05
    time_scale: 1.0
    chunks: 1
  d7b_place_grasp:
    velocity: 0.02
    time_scale: 1.0
    chunks: 1
  d9a_withdraw:
    velocity: 0.02
    time_scale: 1.0
    chunks: 1
    slow_band_mm:
    - 0
    - 80
  d9b_lift:
    velocity: 0.03
    time_scale: 1.0
    chunks: 1
  d9c_baseline:
    velocity: 0.12
    time_scale: 1.0
    chunks: 1
observe_checks:
  workpiece_fine: python3 scripts/measure_object.py --preset workpiece --observe-pose
    workpiece_fine --groups 5 --out runtime/measurements/workpiece_latest.json
  slot_coarse: python3 scripts/measure_object.py --preset slot --observe-pose slot_coarse
    --groups 5 --out runtime/measurements/slot_latest.json
  tables: none
  slot_fine: none
environment_gate: measurement
measurement_targets:
- workpiece_fine
- slot_coarse
