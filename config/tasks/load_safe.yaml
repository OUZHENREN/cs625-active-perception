scope: load
mode: safe
flow: pick_place
phases:
- observe:workpiece_coarse
- observe:workpiece_fine
- observe:tables
- observe:slot_coarse
- observe:slot_fine
- baseline
- pre_grasp
- gripper_init
- grasp
- grip
- lift
- transit
- staging
- pre_insert
- insert
- straighten
- release
- withdraw
- observe:slot_coarse
velocity_scale: 0.02
assembly_velocity_scale: 0.01
time_scale: 2.0
dwell_sec: 1.0
max_chunks: 7
phase_speeds:
  pre_grasp:
    velocity: 0.02
    time_scale: 1.0
    chunks: 3
  grasp:
    velocity: 0.01
    time_scale: 1.5
    chunks: 3
    slow_tail_mm: 30
    slow_velocity: 0.01
    slow_time_scale: 3.0
  lift:
    velocity: 0.03
    time_scale: 1.5
    chunks: 3
  transit:
    velocity: 0.08
    time_scale: 1.0
    chunks: 3
  staging:
    velocity: 0.05
    time_scale: 1.5
    chunks: 3
  pre_insert:
    velocity: 0.03
    time_scale: 1.5
    chunks: 4
    slow_tail_mm: 60
    slow_velocity: 0.01
    slow_time_scale: 2.5
  insert:
    velocity: 0.005
    time_scale: 3.0
    chunks: 6
  straighten:
    velocity: 0.005
    time_scale: 3.0
    chunks: 2
  withdraw:
    velocity: 0.03
    time_scale: 1.5
    chunks: 3
    slow_band_mm:
    - 0
    - 80
  baseline:
    velocity: 0.08
    time_scale: 1.0
    chunks: 3
