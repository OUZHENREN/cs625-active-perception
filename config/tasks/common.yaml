# 因此每次 T0/T2 输出都要与这里比对；超差说明粗匹配锁错特征，不得继续。
# 单位：m + 四元数 [x,y,z,w]。
rvs_taught_views:
  S0: {position: [1.084404, 0.048970, 0.614883],
       quat: [-0.0266, -0.9304, 0.0535, -0.3617]}
  S2: {position: [0.784368, 0.292779, 0.572254],
       quat: [-0.5935, 0.6472, 0.2667, 0.3971]}
rvs_view_drift_warn_mm: 10.0
rvs_view_drift_refuse_mm: 20.0

