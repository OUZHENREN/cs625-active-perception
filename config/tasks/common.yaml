# 六类模式公共配置（唯一权威来源）：世界常量 + 所有可复用位姿
# 位姿全部原样搬自两个已验证基线，未改任何数值：
#   - config/pick_place_real.yaml（2026-10-22 真机跑通，load 流程）
#   - config/unload_real.yaml（unload 流程）
# 用法：run_task 先读本文件，再把 config/tasks/<scope>_<mode>.yaml 浅合并覆盖上去，
#      合并结果直接交给 scripts/run_pick_and_place.py --config。
# 说明：浅合并意味着模式文件里的 phase_speeds 会整段替换，因此每份模式文件都自带完整
#      phase_speeds；本文件只放与 scope/mode 无关的位姿、夹爪与几何常量。
# 坐标系：全部为世界系（base_link）下的 TCP 位置，单位 m；四元数为 (x, y, z, w)。

# ---- 抓取目标（工件台上待抓工件） ----
# 2026-10-27 更正：上一步曾用精观测 ICP 的测量值把位姿改成 [0.8448,...]/[0.9132,...]，
# 但那张"瞄准实测中心"的采集图里工件明显偏离画面中心，说明 ICP 测量本身偏了约 100 mm
# （稳定性≠正确性，四重对称/特征锁定都可能给出一个自洽但错误的解）。
# 因此恢复 10-22/10-24 真机跑通时使用的位姿，作为唯一已验证的基线。
# 新的测量必须先经视觉核验（icp_pose_once --dump-projection 叠加图确认模板贴合工件），
# 才能替换这里的值。
pre_grasp: [0.7677, 0.4903, -0.0595]      # 抓取接近点（距 grasp 约 120 mm）
grasp: [0.8316, 0.5918, -0.0583]          # 抓取点（夹爪闭合处）
grasp_q: [-0.4835, 0.8753, 0.0075, 0.0018]
workpiece_reference:                      # 上述位姿所依据的工件位姿（10-24 实测）
  xyz: [0.5029, 0.6351, 0.1254]
  quat: [0.1910, 0.9816, 0.0019, -0.0068]

# ---- 空中巡航与装入链 ----
transit: [0.95, 0.45, 0.55]               # 抬升后的空中过渡点（装入/取出共用）
# 朝向沿用抓取朝向（真机 20261022_transit_selection 的实测朝向）
transit_q: [-0.4835, 0.8753, 0.0075, 0.0018]
staging: [1.0748, -0.0122, 0.5252]        # 槽位外侧准备点
pre_insert: [1.0996, -0.0125, 0.3773]     # 插入前点（沿倾斜轴后退 150 mm）
insert: [1.1574, -0.0132, 0.0321]         # 插入终点（= unload 的 insert_tcp）

pre_insert_q: [-0.004, 0.997, -0.001, 0.083]   # 进槽倾角（约 -10°）
insert_q: [-0.003, 1.000, -0.002, -0.004]      # 整平后姿态

# ---- 安全回撤位 ----
baseline: [1.044, -0.011, 0.726]          # 每段流程开始/结束的机位
baseline_q: [-0.059, 0.938, 0.060, 0.336]

# ---- 夹爪与行程常量 ----
grip_width_mm: 50.0
grip_current: 0.1
lift_total_mm: 155.0                      # 抬升总高度
safe_clear_mm: 150.0                      # 轴向安全脱开距离（>= 100 才算合法）
extract_steps_mm: 20                      # unload 每次抽出的步长（350 mm 行程 = 18 步）

# ---- 全局保守标定（模式文件会覆盖其中速度/时间项） ----
velocity_scale: 0.02                      # 普通接近速度缩放
assembly_velocity_scale: 0.01             # 装配段速度缩放
time_scale: 2.0
dwell_sec: 1.0
goal_tolerance: 0.002
# 规划器允许的关节终点偏差（rad）。0.02 rad = 1.15 deg，在 0.6 m 力臂上就是 ~20 mm；
# 验收判据是 3 mm，所以真实流程必须把规划终点钉在 IK 解上。仿真覆盖层早已用 0.002，
# 真机此前一直用默认 0.02 —— 2026-10-26 实测 pre_grasp 偏 21.3 mm 就来自这里。
goal_joint_tolerance: 0.002
max_chunks: 7

# ---- unload 专用固定链（槽位机械固定，无需重新检测） ----
slot_origin: [1.241629, 0.181709, 0.443245]
slot_origin_q: [-0.0016287871280747132, 0.004253108458370272, 0.003384045809911108, 0.9999839030478886]
box_in_slot: [1.1635, 0.2032, 0.4423]          # 工件就位后的位姿
box_in_slot_q: [-0.0016, 0.0043, 0.0034, 1.0]

insert_tcp: [1.1574, -0.0132, 0.0321]          # = load 的 insert
insert_tcp_q: [-0.003, 1.000, -0.002, -0.004]  # 整平姿态
entrance_q: [-0.004, 0.997, -0.001, 0.083]     # 抽出时的 -10° 倾角

# ---- unload 的放置目标（默认放回原工件台） ----
place_pre_grasp: [0.7677, 0.4903, -0.0595]
place_grasp: [0.8316, 0.5918, -0.0583]
place_grasp_q: [-0.4835, 0.8753, 0.0075, 0.0018]

# ============================================================================
# environment：环境模型门禁阈值（run_pick_and_place.py 会忽略本段，由 run_task 读取）
# 语义：位姿/点云与机械臂运动前的环境模型加载检查。
# ============================================================================
environment:
  thresholds:
    slot_mm: 1.0            # 槽位定位误差上限
    slot_deg: 0.5           # 槽位姿态误差上限
    workpiece_mm: 3.0       # 工件位姿误差上限
    workpiece_deg: 1.0      # 工件姿态误差上限
    min_points: 20000       # 环境点云最少点数
    max_age_h: 2.0          # 环境模型最大允许陈旧时间（小时）
  required: true            # 每次流程前必须加载环境模型

# ============================================================================
# verification：每阶段实测验收阈值（run_task 读取，runner 忽略）
# ============================================================================
verification:
  pos_mm: 3.0               # 阶段结束 TCP 位置偏差上限
  rot_rad: 0.01             # 阶段结束姿态偏差上限

# ---- 观测点（观察位姿，2026-10-24 推导/实测） -------------------------
# 粗观测位来自真机实测定标（agent_memory §118/§119）；
# 精观测位由 capture_dataset.camera_target() 以 0.68 m / 俯角 20° / 方位 +10° 算出，
# 夹爪间距 0.449 m（>0.38 门禁）。tables 是宽视角，用于复核两张桌面位姿。
# check：该观测点的校验命令，退出码 0 才算通过；空字符串表示只取景不判定。
process_images: true
observe:
  workpiece_coarse:
    xyz: [0.5886, 0.3482, 0.7075]
    quat: [0.2954, -0.7023, -0.2539, -0.5958]
    check: ""
  workpiece_fine:
    # check 分两段：①位姿可重复性（3 帧）；②实测工件位姿与"抓取位姿所依据的参考位姿"
    # 的漂移。②是 2026-10-26 撞倒工件事故后的守卫：工件被移动 >5 mm/1° 时直接拒绝，
    # 不再拿旧常量去抓。
    # 2026-10-26: the previous pose (0.5301,0.3222,0.4126) is geometrically identical
    # to camera_target(part, 0.68 m, az=10, el=20) -- i.e. it was correct, but so
    # frontal that the 441x465 mm near-square face is four-fold ambiguous and the
    # stability check measured a 429 mm spread over three frames.  This pose is the
    # same distance/orbit at az=25, el=30: oblique enough to break the ambiguity
    # (IK solvable, projection area 37 %, centre offset 0.08).
    xyz: [0.63539, 0.33191, 0.46905]
    quat: [-0.46740, 0.72884, 0.27878, 0.41546]
    check: >-
      python3 scripts/check_pose_stability.py --repeat 3 --weights ~/cs625_yolo_seg/runs/segment/runs/segment/box_slot_1280/weights/best.pt --template "$HOME/cs625_rvs_archive/models_20261023/弹仓_装配导出.STL"
      && python3 scripts/grasp_from_measurement.py --measure --check --tol-mm 5 --tol-deg 1
  tables:
    xyz: [0.5886, 0.3482, 0.7075]
    quat: [0.2954, -0.7023, -0.2539, -0.5958]
    check: >-
      python3 scripts/model_environment.py --out runtime/environment --verify-only
  slot_coarse:
    xyz: [0.7802, -0.1458, 0.7986]
    quat: [0.1834, -0.8502, -0.1133, -0.4803]
    check: ""
  slot_fine:
    xyz: [0.7036, -0.0945, 0.8146]
    quat: [-0.16424, 0.8023, 0.12511, 0.56007]
    check: >-
      python3 scripts/model_environment.py --out runtime/environment --verify-only

# ---- 夹爪几何（外撑式撑紧机构，真机 EFG80 驱动） --------------------------
# 所有者确认：EFG 最大张开 50 mm。连杆把 0–50 mm 的行程换成两支撑臂的外撑跨距：
# 全闭 204.00 mm、全张 246.57 mm（SolidWorks 实测）。仿真手指走跨距变化的一半。
# 这条换算关系是 finger_position_m() 的唯一数据来源，不要在代码里另写一份。
gripper_max_opening_mm: 50.0
gripper_span_min_mm: 204.0
gripper_span_max_mm: 246.57

# ---- 工具几何基准（2026-10-31 所有者确认） -------------------------
# TCP 在法兰前方 353 mm（控制器设定，实测与 tcp_pose_broadcaster 差 0.0 mm）。
# 工具【静止实体】是 SolidWorks 导出的同一刚体 gripper_0920.stl
# （cs625_active_perception.urdf.xacro 的 tool0 碰撞几何，单位米、法兰坐标系）：
#   X 对称 -147.285..+147.285（宽轴 294.6 mm，装配时绕工具轴 +90°）
#   Y ±42.5 mm，Z -7.0（安装面后方定位凸台）.. +207.0 mm
# 电机保护座就是这个刚体的一部分（2026-10-31 所有者确认），不在任何"缺失件"之列。
# 张开时支撑臂会向前伸出 146–203 mm，这部分连杆无模型。
#
# 2026-10-30 事故：夹爪下方的电机保护座扫到插槽桌面（slot_table 足迹
# x∈[1.01,1.70] y∈[-0.45,0.40]）。模型按上述刚体包络逐点检查时，规划路径
# 离两张桌最近约 189 mm——即规划路径本身无接触，事故高度怀疑为 2 倍速执行
# 偏离规划路径所致（待复验确认）。因此下降段必须分段慢速执行 + 每段实测校验。
tool_flange_to_tcp_mm: 353.0
tool_body_forward_from_flange_mm: 207.0
tool_body_half_extent_xy_m: 0.1473
tool_safety_note: >-
  The tool rigid body (incl. the motor protection seat) spans flange-frame
  Z -7..+207 mm and X +/-147.3 mm after mounting rotation. Any TCP path whose
  z drops below (table_top + 0.15) must run the envelope check
  scripts/check_tool_envelope.py against BOTH measured table footprints and be
  executed slowly, in segments with verification (2026-10-30 accident lesson).

# ---- RVS 视角位姿（S0 / S2）的参考系 ----------------------------------------
# 唯一事实来源。两张容易混淆的事实，都必须记住：
#   1) RVS 内部的手眼标定 DepthToRobotTCP 以【法兰】为参照
#      （config/handeye 的 T_flange_cam 与它四位小数一致）——这是标定事实；
#   2) 但 RVS 经 9999 发出的视位姿 S0/S2 已经是【TCP 位姿】——这是实测事实：
#      2026-11-03 16:17 站在 S0-as-TCP (1.0785,0.0101,0.6172) 触发 T1，
#      3.5-4.2 s 三帧匹配成功（0.2 mm / 0.07°）；10-30 的成功记录同样是
#      S0-as-TCP (1.0841,0.049,0.6145)。若按法兰解释，相机距插槽仅 0.23 m，
#      与全链路 0.5-0.7 m 的工作距离不符。
# 允许值：tcp | flange。任何新脚本都必须读这里，不得自行假设。
# 目标位姿（R1 插槽 / S3 工件）永远是物体位姿，经 pose_math 换算，不受本条影响。
rvs_view_pose_frame: "tcp"

# ---- 师兄 RVS 工程里教过的记录（2026-11-03 提取，仅作参考/审计，不作插入权威）--
# 来源：CS625_SlotBox_VisualGuidance_RVS20260627-01_WSL.rvs（最新工程，2026-11-02 20:17）
#       该工程是 JSON，节点参数 send_message 里保存着每次教过的成功报文。
# 关键发现：同一个固定插槽，工程里存了三条 R1，y 值从 154.5 到 196.0 mm 不等
#   （跨度 41.5 mm）；说明 RVS 的插槽精匹配本身就有几十毫米量级的离散，
#   不能当作 1 mm 级的标定权威。
#   R1,1256.059,195.993,442.693   ← 与机械标定(181.7)最近，差 14 mm
#   R1,1232.115,159.616,443.912   ← 差 22 mm
#   R1,1189.329,154.476,444.371   ← 差 27 mm
#   S0,1084.404,48.970,614.883    ← 与 2026-10-30 的实测 S0 一致
#   S0,1059.446,25.854,611.218
# 因此插入链的权威仍取机械标定（config/cs625_real_cell_scene.yaml 的 fixture），
# R1 只作健康检查；本段记录用于审计与将来核对，不得用于生成插入轨迹。
rvs_taught_reference:
  project: "CS625_SlotBox_VisualGuidance_RVS20260627-01_WSL.rvs"
  project_mtime: "2026-11-02T20:17"
  r1_taught: [[1.256059, 0.195993, 0.442693],
              [1.232115, 0.159616, 0.443912],
              [1.189329, 0.154476, 0.444371]]
  s0_taught: [[1.084404, 0.048970, 0.614883],
              [1.059446, 0.025854, 0.611218]]
  r1_span_y_mm: 41.5

# ---- RVS 教学参照（视位姿漂移检测的基准） -----------------------------------
# 来源：RVS 工程 CS625_SlotBox_VisualGuidance_RVS20260627-01_WSL.rvs 里
# send_message 节点存储的教学位姿（所有者 10-30/11-02 的实测输出）。
# 用途：同一个固定目标的粗匹配输出（T0/T2）跨会话漂移实测 21-39 mm，
