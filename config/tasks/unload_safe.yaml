# 取出 + 放置 / 安全模式（scope=unload, mode=safe）
# 定位：从槽位里把工件取出（D1–D5），再放回工件台（D6–D9）；全程低速多分段。
# 与另外两种 scope 的区别：只跑 unload 一条流程，不做抓取装入、不做全流程接力。
# 关键安全点：抽出一侧靠夹爪摩擦力，抽出必须 20 mm 小步（extract_steps_mm）；
#            d3c 先做 3 mm 拉拔测试确认"工件跟着走"，测不出位移就不许继续抽。
# 数值来源：config/unload_real.yaml（位姿在 common.yaml），time_scale/dwell 沿用其
#           更保守的 5.0 / 1.5（load 基线是 2.0 / 1.0，unload 更慢）。
# 校正说明：进槽/槽内四段（d2b_entrance_tilted、d2c_straighten、d4_tilt_for_removal、d5_extract_*）
#           一律 0.005 m/s 均匀慢速，并去掉慢尾段——新版 runner 把 d2b 也算作槽内紧间隙，
#           "快巡航 + 慢尾段"在那里会憋住。d2a_pre_insert 按装配段上限从 0.05 降到 0.03。

scope: unload
mode: safe
flow: unload

# 阶段序列与 scripts/run_pick_and_place.py::run_unload 完全一致；
# d5_extract_* 由 extract_steps_mm=20、行程 350 mm 决定，实跑为 d5_extract_1..18。
# 阶段表：环境建模前缀 + 取出执行体 + 终点=工件粗观测
phases:
  - observe:slot_coarse
  - observe:slot_fine
  - observe:tables
  - d1_staging
  - d2_init_before_slot
  - d2a_pre_insert
  - d2b_entrance_tilted
  - d2c_straighten
  - d3a_gripper_init
  - d3b_grip
  - d3c_pull_test
  - d3d_pull_check
  - d3e_return
  - d4_tilt_for_removal
  - d5_extract_*
  - d6a_lift
  - d6b_transit
  - d7a_place_pre_grasp
  - d7b_place_grasp
  - d8_release
  - d8b_init_before_retreat
  - d9a_withdraw
  - d9b_lift
  - d9c_baseline
  - observe:workpiece_coarse

# ---- 全局保守标定（沿用 unload_real.yaml） ----
velocity_scale: 0.02
assembly_velocity_scale: 0.01
time_scale: 5.0
dwell_sec: 1.5
max_chunks: 7

# ---- 分段慢速计划（沿用已验证配置；进槽/槽内段统一 0.005 匀速） ----
# slow_band_mm=[0,80]：夹爪空载进出时，只在工件扶手区（座入位回退 0~80 mm 这一段）走
# 慢速，其余段快速。数值为暂定值（由 CAD 与插入轴估算），待所有者确认真机实际扶手高度。
phase_speeds:
  d1_staging:               {velocity: 0.08, time_scale: 1.0, chunks: 3}
  d2a_pre_insert:           {velocity: 0.03, time_scale: 1.5, chunks: 3}
  d2b_entrance_tilted:      {velocity: 0.03, time_scale: 3.0, chunks: 5, slow_band_mm: [0, 80]}
  d2c_straighten:           {velocity: 0.005, time_scale: 3.0, chunks: 2}
  d3c_pull_test:            {velocity: 0.005, time_scale: 3.0, chunks: 1}
  d3e_return:               {velocity: 0.010, time_scale: 2.5, chunks: 1}
  d4_tilt_for_removal:      {velocity: 0.005, time_scale: 3.0, chunks: 2}
  d5_extract:               {velocity: 0.005, time_scale: 3.0, chunks: 2}
  d6a_lift:                 {velocity: 0.03, time_scale: 1.5, chunks: 3}
  d6b_transit:              {velocity: 0.08, time_scale: 1.0, chunks: 3}
  d7a_place_pre_grasp:      {velocity: 0.05, time_scale: 1.5, chunks: 4}
  d7b_place_grasp:          {velocity: 0.020, time_scale: 1.5, chunks: 3, slow_tail_mm: 30, slow_velocity: 0.008, slow_time_scale: 2.5}
  d9a_withdraw:             {velocity: 0.03, time_scale: 1.5, chunks: 2, slow_band_mm: [0, 80]}
  d9b_lift:                 {velocity: 0.05, time_scale: 1.2, chunks: 2}
  d9c_baseline:             {velocity: 0.08, time_scale: 1.0, chunks: 3}