scope: load
mode: efficient
flow: pick_place
phases:
- observe:workpiece_coarse_efficient
- measure:workpiece_coarse
- nbv:workpiece
- measure:workpiece_fine
- observe:tables
- observe:slot_coarse
- observe:slot_fine
- baseline
- pre_grasp
- gripper_init
- grasp
- grip
- lift
- transit
- staging
- pre_insert
- insert
- straighten
- release
- withdraw
- observe:slot_coarse
velocity_scale: 0.05
assembly_velocity_scale: 0.02
time_scale: 1.0
dwell_sec: 0.0
max_chunks: 1
phase_speeds:
  pre_grasp:
    velocity: 0.03
    time_scale: 1.0
    chunks: 1
  grasp:
    velocity: 0.02
    time_scale: 1.0
    chunks: 1
  lift:
    velocity: 0.03
    time_scale: 1.0
    chunks: 1
  transit:
    velocity: 0.12
    time_scale: 1.0
    chunks: 1
  staging:
    velocity: 0.12
    time_scale: 1.0
    chunks: 1
  pre_insert:
    velocity: 0.02
    time_scale: 1.0
    chunks: 1
  insert:
    velocity: 0.005
    time_scale: 1.0
    chunks: 1
  straighten:
    velocity: 0.005
    time_scale: 1.0
    chunks: 1
  withdraw:
    velocity: 0.02
    time_scale: 1.0
    chunks: 1
    slow_band_mm:
    - 0
    - 80
  baseline:
    velocity: 0.12
    time_scale: 1.0
    chunks: 1
observe_checks:
  workpiece_fine: python3 scripts/measure_object.py --preset workpiece --stage fine
    --groups 3 --out runtime/measurements/workpiece_latest.json --prior runtime/measurements/workpiece_coarse.json
  slot_coarse: python3 scripts/measure_object.py --preset slot --observe-pose slot_coarse
    --groups 5 --out runtime/measurements/slot_latest.json
  tables: none
  slot_fine: none
  # 2026-11-24 所有者批准：--prior-max-age-min 由 30 改为 0。
  # 30 的含义是"先验文件 30 分钟内就直接采用、根本不拍照"，导致
  # "拍摄验证"可以通过而一张新图都没拍（当天 19:34 就发生了：手工测量刷新的先验
  # 只差 4.4 分钟，粗观测被整段跳过）。改成 0 后先验仍然作为配准引导使用，
  # 但粗观测一律实拍；代价是每次约多 1 分钟（当天实测 3 组×3 帧共 46 秒）。
  workpiece_coarse: python3 scripts/measure_object.py --preset workpiece --stage coarse
    --groups 3 --out runtime/measurements/workpiece_coarse.json --prior auto --auto-release
    --prior-max-age-min 0
  workpiece_coarse_efficient: python3 scripts/measure_object.py --preset workpiece
    --stage coarse --groups 3 --out runtime/measurements/workpiece_coarse.json --prior
    auto --auto-release --prior-max-age-min 0
environment_gate: measurement
measurement_targets:
- workpiece_fine
- slot_coarse
