scope: load
mode: efficient
flow: pick_place
phases:
- observe:workpiece_coarse
- nbv:workpiece
- observe:workpiece_fine
- observe:tables
- observe:slot_coarse
- observe:slot_fine
- baseline
- pre_grasp
- gripper_init
- grasp
- grip
- lift
- transit
- staging
- pre_insert
- insert
- straighten
- release
- withdraw
- observe:slot_coarse
velocity_scale: 0.05
assembly_velocity_scale: 0.02
time_scale: 1.0
dwell_sec: 0.0
max_chunks: 1
phase_speeds:
  pre_grasp:
    velocity: 0.03
    time_scale: 1.0
    chunks: 1
  grasp:
    velocity: 0.02
    time_scale: 1.0
    chunks: 1
  lift:
    velocity: 0.03
    time_scale: 1.0
    chunks: 1
  transit:
    velocity: 0.12
    time_scale: 1.0
    chunks: 1
  staging:
    velocity: 0.12
    time_scale: 1.0
    chunks: 1
  pre_insert:
    velocity: 0.02
    time_scale: 1.0
    chunks: 1
  insert:
    velocity: 0.005
    time_scale: 1.0
    chunks: 1
  straighten:
    velocity: 0.005
    time_scale: 1.0
    chunks: 1
  withdraw:
    velocity: 0.02
    time_scale: 1.0
    chunks: 1
    slow_band_mm:
    - 0
    - 80
  baseline:
    velocity: 0.12
    time_scale: 1.0
    chunks: 1
observe_checks:
  workpiece_fine: python3 scripts/measure_object.py --preset workpiece --stage fine
    --groups 4 --out runtime/measurements/workpiece_latest.json
  slot_coarse: python3 scripts/measure_object.py --preset slot --observe-pose slot_coarse
    --groups 5 --out runtime/measurements/slot_latest.json
  tables: none
  slot_fine: none
  workpiece_coarse: python3 scripts/measure_object.py --preset workpiece --stage coarse
    --groups 3 --out runtime/measurements/workpiece_coarse.json
environment_gate: measurement
measurement_targets:
- workpiece_fine
- slot_coarse
