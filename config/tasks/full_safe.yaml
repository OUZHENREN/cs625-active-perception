# 全流程 / 安全模式（scope=full, mode=safe）——一次上机跑完"装入 + 取出"
# 定位：先跑 load（抓取装入，停在 baseline），等人工确认后从 unload 的 d1_staging 继续，
#       全程沿用两条已验证基线的保守分段（两套 phase_speeds 原样合并）。
# 与另外两种 scope 的区别：不分两次合并配置、不分两次启动；但两段流程仍各自独立下发。
# 关键安全点：handover=confirm —— load 结束必须停住，由人确认工件确实在槽内后再取出；
#            中途任何异物/擦碰都要停机，不允许自动连跑。
# 数值来源：load 段取自 config/pick_place_real.yaml，unload 段取自 config/unload_real.yaml；
#           全局 time_scale/dwell 取两者中更保守的 5.0 / 1.5（dwell 只有一个值，取 unload 值）。
# 校正说明：
#   - load 的 pre_grasp/grasp 取实际执行值 0.02/0.01：2026-10-22 真机跑的时候旧 runner 忽略
#     这两段的阶段档案（写死用全局 velocity_scale / assembly_velocity_scale），
#     pick_place_real.yaml 里的 0.08/0.04 从未上过真机。
#   - unload 的 d2b_entrance_tilted 与槽内 d2c/d4/d5 一律 0.005 m/s 均匀慢速、不带慢尾段；
#     d2a_pre_insert 按装配段上限从 0.05 降到 0.03。
# 估算耗时：load 段约 6.1 min、unload 段约 7.3 min，合计约 13 min（不含 handover 等待）。

scope: full
mode: safe
scopes: [load, unload]
flows: [pick_place, unload]
handover: confirm

# 全流程阶段 = load 13 段 + unload 21 类阶段（d5_extract_* 实跑 d5_extract_1..18）。
# 阶段表（默认=装入段）：环境建模前缀只做一次，装入执行体，终点=插槽粗观测
# 便于 run_task 按 flow 切片（runner 忽略这两个键）。
# ---- 全局保守标定 ----
velocity_scale: 0.02
assembly_velocity_scale: 0.01
time_scale: 5.0              # 取 unload 基线；load 的 pre_grasp/grasp 因此比单独跑 load 更慢（更保守）
dwell_sec: 1.5
max_chunks: 7

# ---- 分段慢速计划：load 段 + unload 段沿用两条已验证基线（槽内与 grasp 取实际执行值） ----
# slow_band_mm=[0,80]：夹爪空载进出时，只在工件扶手区（座入位回退 0~80 mm 这一段）走
# 慢速，其余段快速。数值为暂定值（由 CAD 与插入轴估算），待所有者确认真机实际扶手高度。
phase_speeds:
  # load（config/pick_place_real.yaml，pre_grasp/grasp 改为 2026-10-22 实际执行值）
  pre_grasp:                {velocity: 0.02, time_scale: 1.0, chunks: 3}
  grasp:                    {velocity: 0.01, time_scale: 1.5, chunks: 3, slow_tail_mm: 30, slow_velocity: 0.010, slow_time_scale: 3.0}
  lift:                     {velocity: 0.03, time_scale: 1.5, chunks: 3}
  transit:                  {velocity: 0.08, time_scale: 1.0, chunks: 3}
  staging:                  {velocity: 0.05, time_scale: 1.5, chunks: 3}
  pre_insert:               {velocity: 0.03, time_scale: 1.5, chunks: 4, slow_tail_mm: 60, slow_velocity: 0.010, slow_time_scale: 2.5}
  insert:                   {velocity: 0.005, time_scale: 3.0, chunks: 6}
  straighten:               {velocity: 0.005, time_scale: 3.0, chunks: 2}
  withdraw:                 {velocity: 0.03, time_scale: 1.5, chunks: 3, slow_band_mm: [0, 80]}
  baseline:                 {velocity: 0.08, time_scale: 1.0, chunks: 3}
  # unload（config/unload_real.yaml；进槽/槽内段统一 0.005 匀速）
  d1_staging:               {velocity: 0.08, time_scale: 1.0, chunks: 3}
  d2a_pre_insert:           {velocity: 0.03, time_scale: 1.5, chunks: 3}
  d2b_entrance_tilted:      {velocity: 0.03, time_scale: 3.0, chunks: 5, slow_band_mm: [0, 80]}
  d2c_straighten:           {velocity: 0.005, time_scale: 3.0, chunks: 2}
  d3c_pull_test:            {velocity: 0.005, time_scale: 3.0, chunks: 1}
  d3e_return:               {velocity: 0.010, time_scale: 2.5, chunks: 1}
  d4_tilt_for_removal:      {velocity: 0.005, time_scale: 3.0, chunks: 2}
  d5_extract:               {velocity: 0.005, time_scale: 3.0, chunks: 2}
  d6a_lift:                 {velocity: 0.03, time_scale: 1.5, chunks: 3}
  d6b_transit:              {velocity: 0.08, time_scale: 1.0, chunks: 3}
  d7a_place_pre_grasp:      {velocity: 0.05, time_scale: 1.5, chunks: 4}
  d7b_place_grasp:          {velocity: 0.020, time_scale: 1.5, chunks: 3, slow_tail_mm: 30, slow_velocity: 0.008, slow_time_scale: 2.5}
  d9a_withdraw:             {velocity: 0.03, time_scale: 1.5, chunks: 2, slow_band_mm: [0, 80]}
  d9b_lift:                 {velocity: 0.05, time_scale: 1.2, chunks: 2}
  d9c_baseline:             {velocity: 0.08, time_scale: 1.0, chunks: 3}

# 全流程第 1 步：环境建模前缀（工件粗/精观测、桌子扫描、插槽粗/精观测）+ 装入
# 全流程第 2 步：不再重复桌子扫描（同一次运行里刚做过），补插槽粗/精观测确认工件已入槽 + 取出 + 终点=工件粗观测

# 阶段表（默认 = 装入段）：观测前缀只做一次 → baseline → 装入 → 终点插槽粗观测
phases:
  - observe:workpiece_coarse
  - observe:workpiece_fine
  - observe:tables
  - observe:slot_coarse
  - observe:slot_fine
  - baseline
  - pre_grasp
  - gripper_init
  - grip
  - grasp
  - lift
  - transit
  - staging
  - pre_insert
  - insert
  - straighten
  - release
  - withdraw
  - observe:slot_coarse

# 全流程第 1 步：环境建模前缀 + 装入
phases_load:
  - observe:workpiece_coarse
  - observe:workpiece_fine
  - observe:tables
  - observe:slot_coarse
  - observe:slot_fine
  - baseline
  - pre_grasp
  - gripper_init
  - grip
  - grasp
  - lift
  - transit
  - staging
  - pre_insert
  - insert
  - straighten
  - release
  - withdraw
  - observe:slot_coarse

# 全流程第 2 步：不再重复桌子扫描（同一次运行刚做过）+ 取出
phases_unload:
  - observe:slot_coarse
  - observe:slot_fine
  - d1_staging
  - d2_init_before_slot
  - d2a_pre_insert
  - d2b_entrance_tilted
  - d2c_straighten
  - d3a_gripper_init
  - d3b_grip
  - d3c_pull_test
  - d3d_pull_check
  - d3e_return
  - d4_tilt_for_removal
  - d5_extract_*
  - d6a_lift
  - d6b_transit
  - d7a_place_pre_grasp
  - d7b_place_grasp
  - d8_release
  - d8b_init_before_retreat
  - d9a_withdraw
  - d9b_lift
  - d9c_baseline
  - observe:workpiece_coarse
