/cs625_baseline_selector:
  ros__parameters:
    use_sim_time: true
    reachable_candidates_topic: /view_planner/reachable_candidates
    selected_view_topic: /view_planner/selected_view
    state_topic: /active_localization/state
    strategy: proposed_joint_score
    random_seed: 17
    cycle_index: 0
    fixed_candidate_id: fibonacci_00
    predefined_candidate_ids: [fibonacci_00, fibonacci_08, fibonacci_16]
    scene_id: minimal_occlusion
    episode_log_directory: /tmp/cs625_active_perception/p5_episodes
    git_commit: UNRECORDED
    data_source: gazebo_runtime
    validity_label: scoring_proxy_only
    # P5 joint-score terms: localization is a geometry proxy until a validated
    # localizer provides an observed information-gain estimate.
    localization_gain_weight: 1.0
    reachability_quality_weight: 1.0
    motion_cost_weight: 0.35
    planning_time_weight: 0.15
    motion_cost_scale: 6.0
    planning_time_scale: 5.0
