# Gazebo source topics are kept under the senior /camera sensor contract.
# Only the ROS names below cross into the application. The adapter consumes
# these names and publishes the normalized common.yaml contract.
- ros_topic_name: "/sim/camera/image"
  gz_topic_name: "/camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  frame_id: "camera_color_optical_frame"
- ros_topic_name: "/sim/camera/depth_image"
  gz_topic_name: "/camera/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  frame_id: "camera_depth_optical_frame"
- ros_topic_name: "/sim/camera/camera_info"
  gz_topic_name: "/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  frame_id: "camera_color_optical_frame"
- ros_topic_name: "/sim/camera/points"
  gz_topic_name: "/camera/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  frame_id: "camera_depth_optical_frame"
