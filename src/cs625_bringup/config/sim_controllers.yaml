# Simulation-only controller profile.
# The senior launch/control architecture is reused, but the senior
# cs_controllers plugin family is tied to the real-driver SDK and is not
# available in the Humble VM until that SDK gate is cleared. Standard Humble
# controllers keep the simulation independent of the real driver.
controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: forward_command_controller/ForwardCommandController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    # A controller result must reflect its measured joint state, not merely
    # elapsed trajectory time.  These bounds match P7's adapter-side terminal
    # state gate and make an untracked Gazebo command an explicit failure.
    constraints:
      stopped_velocity_tolerance: 0.01
      # Controller feedback reaches the goal, but Gazebo's action monitor can
      # observe it just after one simulation second.  Preserve 0.01 rad final
      # precision while allowing a bounded result-settling window.
      #
      # 15 s, not 5 s.  Measured on the insertion sequence: a 14.83 s planned
      # trajectory aborted with "goal_time_tolerance exceeding by 5.001785 seconds"
      # while the arm had in fact arrived, and a 17.74 s trajectory completed in
      # 19.17 s with 4.8e-05 rad of terminal joint error.  The planner's duration is
      # optimistic for the simulated position loop, so the binding constraint was the
      # clock rather than the tracking.  Raising the window leaves the 0.01 rad
      # precision requirement untouched; slowing the motion instead would change what
      # the experiment measures.
      goal_time: 15.0
      # The virtual position plant can lag a retimed point transiently; do
      # not abort before the terminal measurement.  The strict goal tolerance
      # remains the acceptance gate, together with the adapter's independent
      # observed-terminal check.
      shoulder_pan_joint: {trajectory: 10.0, goal: 0.01}
      shoulder_lift_joint: {trajectory: 10.0, goal: 0.01}
      elbow_joint: {trajectory: 10.0, goal: 0.01}
      wrist_1_joint: {trajectory: 10.0, goal: 0.01}
      wrist_2_joint: {trajectory: 10.0, goal: 0.01}
      wrist_3_joint: {trajectory: 10.0, goal: 0.01}

gripper_controller:
  ros__parameters:
    joints:
      - gripper_right_finger_joint
    interface_name: position
