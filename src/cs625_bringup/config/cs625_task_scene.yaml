# CS625 shielding-module insertion task: scene and task constants.
#
# Authority for the task geometry.  The matching Gazebo scene is
# cs625_simulation/worlds/cs625_insertion_scene.sdf, whose <include> poses must
# stay equal to `fixture.pose_world` and `module.home_pose_world` below.
#
# Provenance: measured from the SolidWorks export `屏蔽片模块插槽和弹仓装配.STL`.
# The seated module pose is an exact rigid transform between the part frame and
# the assembly frame, recovered by matching triangle signatures and confirmed to
# 0.03 µm at every vertex.  See docs/cs625_task_models.md.
#
# Lengths are metres, angles are radians unless a key says otherwise.

cs625_task_scene:
  ros__parameters:
    # --- frames ---------------------------------------------------------
    # The fixture model and the measured seated pose share the SolidWorks
    # assembly frame, so this single transform places both.
    assembly_origin_world: [0.620, 0.000, 0.2851]
    assembly_rpy_world: [0.0, 0.0, 0.0]

    # --- fixture (static) ------------------------------------------------
    fixture:
      model_uri: "model://cs625_task/slot_fixture"
      pose_world: [0.620, 0.000, 0.2851, 0.0, 0.0, 0.0]
      mass_kg: 12.965
      slot_is_wedge: true
      # Measured clearance from the module faces to the wall, along the
      # insertion axis: 1.008 mm at the narrow end rising to 14.28 mm.  The
      # narrow-end value sets how much pose error the entry can absorb; it is
      # NOT the 2 mm nominal, which the mesh undershoots by about 2%.
      measured_clearance_m: [0.001008, 0.014280]

    # --- module -----------------------------------------------------------
    module:
      model_uri: "model://cs625_task/shielding_module"
      mass_kg: 19.0
      # Mesh-frame bounding box and centre of mass, for cross-checks.
      bbox_min_m: [-0.4358, -0.0220, -0.2400]
      bbox_max_m: [ 0.0188,  0.1090,  0.2250]
      # Measured in SolidWorks; the mesh geometric centroid is within 1.0 mm.
      centre_of_mass_m: [-0.20849, 0.06355, -0.01944]
      mesh_centroid_m: [-0.208502, 0.063361, -0.018444]
      # SolidWorks reports 3.41209164e-3 m^3 for the module assembly.  An earlier
      # note quoted 3.084430e-3 m^3 for a different selection; the mesh measures
      # 3.4297230e-3 m^3 before decimation, so the larger figure is the one that
      # matches the geometry.  The mass is user-overridden, so the derived
      # density (5568 kg/m^3) is not a material property.
      solidworks_volume_m3: 3.41209164e-3
      # Raw SolidWorks output, kept so the sign convention stays machine-checked
      # rather than being asserted in prose.  SolidWorks reports "positive tensor
      # notation", Lxy = integral(x*y) dm, so the SDF inertia off-diagonal is
      # MINUS this value.  Units g*mm^2, so the scale to kg*m^2 is 1e-9.
      # Verified twice against the parallel-axis theorem; see the work log.
      solidworks_positive_tensor: {
        unit: "g*mm^2", scale: 1.0e-9,
        Lxx: 399360242.75, Lxy: -20923.40,    Lxz: -10993.17,
        Lyy: 789151666.61, Lyz: -4086532.08,  Lzz: 434974118.21,
      }
      # Initial pose: upright on the work surface, clear of the fixture.
      home_pose_world: [0.700, -0.550, 0.240, 0.0, 0.0, 0.0]

    # --- insertion ---------------------------------------------------------
    insertion:
      # Module own +Z in the world, taken from the measured seated orientation.
      axis_world: [-0.104528465, 0.0, 0.994521895]
      # Measured: when seated the module spans assembly Z [-0.26439, 0.20601]
      # and the fixture [-0.24510, 0.26071], so the module top sits 61.2 mm
      # below the fixture top and the two overlap over 437.3 mm.
      module_axial_length_m: 0.465
      axial_overlap_when_seated_m: 0.4373
      top_recess_when_seated_m: 0.0612
      # Full travel for a vertical insertion that starts with the module clear
      # of the fixture: length + recess + approach clearance.
      travel_m: 0.546
      approach_clearance_m: 0.020
      seated_pose_world: [0.768045, 0.208500, 0.270789, -0.104719755, 0.0, 1.570796327]

    # --- payload budget ----------------------------------------------------
    # CS625 rated payload is 25 kg.  With the real tool mass the end effector
    # chain reaches 23.64 kg, i.e. 94.6% of rating.  That is a hard constraint:
    # the rating is a static figure at a specified centre-of-mass offset, and
    # the force available falls away sharply near it.  Recheck before enabling
    # real execution.
    payload:
      rated_kg: 25.0
      module_kg: 19.0
      # "夹持机构0228" as measured in SolidWorks: 4.580 kg, 1710866.064 mm^3
      # (density 2.677 g/cm^3, consistent with aluminium).
      gripper_kg: 4.580
      gripper_model: "夹持机构0228"
      camera_kg_placeholder: 0.06
      total_kg: 23.64
      fraction_of_rating: 0.946

    # --- grasp ------------------------------------------------------------
    # The tool is an expanding brace, not an external parallel grip: the two
    # support arms go BETWEEN the module's two handles and open outward to press
    # on their inner faces.  cs625_parallel_gripper.xacro already has the right
    # kinematics (finger axes 0 -1 0 and 0 1 0 move apart); what is wrong there is
    # the scale -- 0.33 kg against the measured 4.580 kg for 夹持机构0228.
    #
    # Geometry cross-check, module frame, millimetres.  The module carries two
    # identical handles (61.583 cm^3 each, 26.0 x 55.0 x 146.0), symmetric about
    # the body centre:
    #   left   handle X [-356.5, -330.5]
    #   right  handle X [ -86.5,  -60.5]
    # giving inner-face span 244.00, outer-face span 296.00, centre span 270.00.
    # SolidWorks measures the gripper's support arms at 246.57 between their
    # parallel faces, which matches the INNER span to 2.57 mm total (1.29 mm per
    # side) and misses the other two candidates by 23 and 49 mm.
    grasp:
      style: expanding_brace
      measured_arm_span_m: 0.24657
      handle_pair: [left, right]
      handle_inner_span_m: 0.24400
      handle_outer_span_m: 0.29600
      handle_centre_span_m: 0.27000
      span_mismatch_m: 0.00257
      # Contact happens on the inner faces, so these are the surfaces the grasp
      # template must use, not the module's outer faces.
      contact_face_x_m: [-0.3305, -0.0865]
      handle_x_ranges_m: [[-0.3565, -0.3305], [-0.0865, -0.0605]]
      handle_y_range_m: [-0.0220, 0.0330]
      handle_z_range_m: [-0.1720, -0.0260]
      contact_centre_z_m: -0.0990
      # The body face starts at Y = +12 mm, so the handles stand 34 mm proud and
      # the arms have that much room to enter before reaching the body.
      handle_protrusion_m: 0.0340
      approach_axis: "-Y"
      # The gripper opens to 246.57 mm, 2.57 mm wider than the 244.00 mm gap it
      # presses into.  Confirmed by the task owner as PRELOAD, not CAD mismatch:
      # the arms deflect the handles outward by 1.285 mm per side and the grip
      # force is therefore stiffness-driven, with no force setpoint.
      #
      # Simulation consequence, and it matters: a preloaded interference fit
      # cannot be honestly reproduced by rigid-body contact.  The options are
      #   (a) place the arms at exactly 244.00 mm and accept that the normal
      #       force then comes only from the solver, i.e. approximately zero;
      #   (b) represent the closed grasp with an attachment joint, which the
      #       repository already has in cs625_task_orchestrator, and label it as
      #       a mechanism diagnostic rather than physical grasping;
      #   (c) model the arms compliantly.
      # Decide before any episode depends on grip force.
      interference_fit: preload
      preload_per_side_m: 0.001285
      preload_total_m: 0.00257
      arm_span_open_m: 0.24657
      arm_span_at_contact_m: 0.24400
      gripper_urdf: "cs625_parallel_gripper.xacro (kinematics reused, geometry and scale wrong)"
      # Measured from 夹持机构0228.STL, which the tool owner exported in metres.
      # My enclosed volume agrees with SolidWorks to 0.007% (1710.978 against
      # 1710.866 cm^3), so the mesh is the right part.  Its part frame is offset:
      # the body sits at Y 766.5..980.5, Z -1158.8..-1073.8 mm.
      gripper:
        stl_extents_m: [0.29457, 0.21400, 0.08500]
        stl_bounds_min_m: [-0.138274, 0.766503, -1.158772]
        stl_bounds_max_m: [ 0.156297, 0.980503, -1.073772]
        mass_kg: 4.580
        solidworks_volume_m3: 1.710866064e-3
        centre_of_mass_m: [0.008910, 0.863944, -1.109692]
        # Raw SolidWorks tensor, same convention note as the module: the SDF
        # off-diagonal is minus this.  Units kg*mm^2, so the scale is 1e-6.
        solidworks_positive_tensor: {
          unit: "kg*mm^2", scale: 1.0e-6,
          Lxx: 16561.263, Lxy: 47.184,   Lxz: -0.450,
          Lyy: 20907.398, Lyz: -652.147, Lzz: 34121.009,
        }
        # Identified arm bodies in the mesh, for the split into moving parts.
        # Both span Y [823.5, 969.5] and Z [-1132.8, -1074.8] mm, i.e. they are
        # the pair of support arms; the right one (comp 140) is the cleaner
        # single arm at X [122.3, 156.3].
        arm_body_negative_x: { x_mm: [-138.3, -18.3], volume_cm3: 160.571 }
        arm_body_positive_x: { x_mm: [ 122.3, 156.3], volume_cm3:  83.951 }
        # NOT YET KNOWN, and it blocks mounting the tool on the arm: the
        # transform from this part frame to tool0.  The existing xacro uses
        # xyz="0.085 0 0" on tool0, which is a placeholder.
        flange_to_part_frame: unknown
